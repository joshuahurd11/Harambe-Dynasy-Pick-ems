


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harambe Dynasty Pick'em</title>

  

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #4d031e;
    }

    h1 {
  color: #ddd2c2; /* Title font color */
}

h2 {
  color: #ddd2c2; /* Header font color */
}

    p {
  color: #ddd2c2; /* Header font color */
}

    .standings-frame {
  height: 500px;
  overflow: hidden;
}

.standings-frame iframe {
  width: 100%;
  height: 550px;
  margin-top: -30px;
  margin-bottom: -100px;
}

    form {
      background: beige;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ccc;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    .option {
      margin-top: 8px;
      font-weight: normal;
    }

    button {
      margin-top: 24px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background: #1769aa;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      background: #888;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Harambe Dynasty Pick'em</h1>
  <p>Submit your winner selections for Week 1.</p>

  <form id="picksForm">
    <label for="player">Your Name</label>
    <input id="player" Name="player" required>

    <label>Josh vs. Dylan</label>
    <div class="option">
      <input type="radio" Name="matchup1" value="Josh" required>
      Josh
    </div>
    <div class="option">
      <input type="radio" Name="matchup1" value="Dylan">
      Dylan
    </div>

    <label>Jake vs. David</label>
    <div class="option">
      <input type="radio" Name="matchup2" value="Jake" required>
      Jake
    </div>
    <div class="option">
      <input type="radio" Name="matchup2" value="David">
      David
    </div>

    <label>Nate vs. Joey</label>
    <div class="option">
      <input type="radio" Name="matchup3" value="Nate" required>
      Nate
    </div>
    <div class="option">
      <input type="radio" Name="matchup3" value="Joey">
      Joey
    </div>

    <label>Drew vs. Austin</label>
    <div class="option">
      <input type="radio" Name="matchup4" value="Drew" required>
      Drew
    </div>
    <div class="option">
      <input type="radio" Name="matchup4" value="Austin">
      Austin
    </div>

    <label>Randy vs. Sam</label>
    <div class="option">
      <input type="radio" Name="matchup5" value="Randy" required>
      Randy
    </div>
    <div class="option">
      <input type="radio" Name="matchup5" value="Sam">
      Sam
    </div>

    <button type="submit">Submit Picks</button>
    <div id="message"></div>
  </form>

  <script>

    // Change this to your actual deadline.
// This example is September 10, 2026 at 7:00 PM Eastern Time. 2026-09-10T19:00:00-04:00
const CUTOFF_TIME = new Date("2026-08-24T20:30:00-04:00");
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzKLSsmLQL9am3JtQK5RUeWBIL_6UI8kzUNw0vZRn8yUvVWRZQhRgc_fjV7M8AA0ygl/exec";
    
document.getElementById("picksForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = event.target.querySelector("button");
  const message = document.getElementById("message");

  // Convenient browser-side check
  if (new Date() >= CUTOFF_TIME) {
    message.textContent = "Submissions are closed.";
    button.disabled = true;
    return;
  }

  button.disabled = true;
  message.textContent = "Submitting...";

  const formData = new FormData(event.target);

  const payload = {
    player: formData.get("player"),
    week: 1,
    picks: [
      {
        matchup: "Josh vs. Dylan",
        selection: formData.get("matchup1")
      },
      {
        matchup: "Jake vs. David",
        selection: formData.get("matchup2")
      },
      {
        matchup: "Nate vs. Joey",
        selection: formData.get("matchup3")
      },
      {
        matchup: "Drew vs. Austin",
        selection: formData.get("matchup4")
      },
      {
        matchup: "Randy vs. Sam",
        selection: formData.get("matchup5")
      }
    ]
  };

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(payload),
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      }
    });

    message.textContent = "Your picks were submitted!";
    event.target.reset();

  } catch (error) {
    message.textContent =
      "The picks may have been submitted, but the response could not be confirmed.";
    console.error(error);
  }

  button.disabled = false;
});
  </script>
</body>
</html>

    src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRRzWCUMBPJ594VN5bKEzcAIRYMCefGTCXIqp8jKrJVlpPa89sPirGCwoSMWu8XahrBzv_kVrOYeQVB/pubhtml?widget=true&headers=false"
    width="100%"
    height="550"
    frameborder="0">
  </iframe>
</div>
